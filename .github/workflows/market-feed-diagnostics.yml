name: Market Feed Diagnostics
on:
  push:
    branches: [fix-free-market-feed]
permissions:
  contents: read
jobs:
  inspect-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run typecheck
      - name: Test postseason eligibility and provider stats
        run: node --import tsx --test scripts/market-feed-test.ts
      - name: Inspect corrected MLB feed without changing prices
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          node --import tsx --input-type=module <<'JS'
          import { getBdlMlbLiveStats } from "./lib/balldontlie.ts";
          import { calculateMlbLiveImpact } from "./lib/live-pricing.ts";
          const now = new Date();
          const dates = [new Date(now.getTime()-86400000).toISOString().slice(0,10), now.toISOString().slice(0,10)];
          const rows = await getBdlMlbLiveStats(dates);
          console.log("Corrected feed:", JSON.stringify({count:rows.length,games:[...new Set(rows.map(r=>r.gameId))]}));
          console.log("Harper:", JSON.stringify(rows.filter(r=>r.playerId===515).map(r=>({game:r.gameId,state:r.statusState,impact:calculateMlbLiveImpact(r.stats)}))));
          if (!rows.some(r=>r.gameId===15467364)) throw new Error("Reported Phillies-Braves game is still missing");
          JS
