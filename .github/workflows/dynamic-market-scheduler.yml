name: Dynamic Market Scheduler

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dynamic-market-scheduler.yml
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 10 * * *"
    - cron: "37 9 * * 2"
    - cron: "5 0 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Market update mode
        required: true
        default: live
        type: choice
        options:
          - live
          - baseline
          - rosters
          - weekly

permissions:
  contents: read

concurrency:
  group: nexathlete-dynamic-market
  cancel-in-progress: false

jobs:
  update-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}

    steps:
      - name: Check required secrets
        id: secrets
        shell: bash
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$BALLDONTLIE_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL and BALLDONTLIE_API_KEY repository secrets are required before automatic pricing can run."
          fi

      - name: Checkout market engine
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm install

      - name: Generate Prisma client
        if: steps.secrets.outputs.ready == 'true'
        run: npm run db:generate

      - name: Choose update mode
        if: steps.secrets.outputs.ready == 'true'
        id: mode
        shell: bash
        run: |
          MODE="live"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "17 10 * * *" ]; then
            MODE="baseline"
          elif [ "${{ github.event.schedule }}" = "37 9 * * 2" ]; then
            MODE="rosters"
          elif [ "${{ github.event.schedule }}" = "5 0 * * 1" ]; then
            MODE="weekly"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running $MODE market update"

      - name: Sync active rosters and initialize new players
        if: steps.secrets.outputs.ready == 'true' && steps.mode.outputs.mode == 'rosters'
        run: |
          npm run sync:rosters
          npm run init:prices

      - name: Update live game prices
        if: steps.secrets.outputs.ready == 'true' && steps.mode.outputs.mode == 'live'
        run: npm run update:live

      - name: Refresh daily season baseline
        if: steps.secrets.outputs.ready == 'true' && steps.mode.outputs.mode == 'baseline'
        run: npm run update:market

      - name: Snapshot weekly scout leaderboard
        if: steps.secrets.outputs.ready == 'true' && steps.mode.outputs.mode == 'weekly'
        run: npm run snapshot:weekly
